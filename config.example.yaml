# ARGUS collector configuration (no secrets here; the worker token is
# entered in the panel's Yhteys block and stored with DPAPI, never here).
# Copy to %LOCALAPPDATA%\Gridex\ArgusCollector\config.yaml (install.ps1 does
# it on first install) or to the repo root as config.yaml (git-ignored).

argus:
  # Default shown in the Yhteys block's address field (ARGUS20_TZ_TANDEM.md
  # pair A1); the owner can type a different one, e.g. the local
  # contract_server/ while the real /api/collector is not up yet.
  base_url: "https://argus.gridex.fi"

network:
  # "system": ARGUS requests use the Windows proxy settings (needed for the
  # real external host). "direct": never use a proxy, even for ARGUS.
  # Loopback (127.0.0.1/localhost, e.g. contract_server/) always bypasses the
  # proxy regardless of this setting -- the Windows registry proxy otherwise
  # answers 127.0.0.1 with 502 Bad Gateway.
  proxy: "system"

test_site:
  # Port of the local fixture site served by "Avaa tyoselain" and the tests.
  port: 8765

model:
  # OpenAI-compatible local endpoint on this PC, never through the system
  # proxy. Ollama by default; a llama.cpp server works with its own /v1 URL.
  # diagnose.ps1 and the panel probe <endpoint>/models and expect `name` listed.
  endpoint: "http://127.0.0.1:11434/v1"
  # Model installed by scripts\install_model.ps1 (fits the 24 GB RTX 4090 with
  # a 16k context; strong JSON and Finnish). Alternative: "llama3.1:8b".
  name: "qwen2.5:14b-instruct"

walk:
  # Distinct pages one site walk may open before it finishes.
  page_budget: 15
