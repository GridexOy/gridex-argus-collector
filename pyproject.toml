[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-collector"
version = "0.4.8.3"
description = "ARGUS 2.0 local contact collector (Selain) for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.56.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "types-PyYAML==6.0.12.20250915",
  "pip-audit==2.10.0",
  "import-linter==2.15",
]

[tool.setuptools.packages.find]
where = ["collector/src"]

[tool.pytest.ini_options]
pythonpath = ["collector/src", "."]
testpaths = ["collector", "contract_server", "test_site"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "collector/src"
packages = ["argus_collector"]

[[tool.mypy.overrides]]
module = ["scripts.*", "test_site.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "argus_collector"

[[tool.importlinter.contracts]]
name = "layers: ui|pilot > scheduler > walk > browser|extraction|diagnostics|delivery > discovery|models|evidence|api_client > normalization|storage|worker_auth > runtime"
type = "layers"
layers = [
  "argus_collector.ui | argus_collector.pilot",
  "argus_collector.scheduler",
  "argus_collector.walk",
  "argus_collector.browser | argus_collector.extraction | argus_collector.diagnostics | argus_collector.delivery",
  "argus_collector.discovery | argus_collector.models | argus_collector.evidence | argus_collector.api_client",
  "argus_collector.normalization | argus_collector.storage | argus_collector.worker_auth",
  "argus_collector.runtime",
]

[[tool.importlinter.contracts]]
name = "modules talk to each other only through contract.py"
type = "forbidden"
source_modules = [
  "argus_collector.ui",
